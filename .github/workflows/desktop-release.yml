name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            builder_args: --mac dmg
            artifact_name: prometheon-si-macos
            dist_glob: desktop/dist/*.dmg
          - os: windows-latest
            builder_args: --win nsis
            artifact_name: prometheon-si-windows
            dist_glob: desktop/dist/*.exe
          - os: ubuntu-latest
            builder_args: --linux AppImage
            artifact_name: prometheon-si-linux
            dist_glob: desktop/dist/*.AppImage

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Build installer
        working-directory: desktop
        run: npx electron-builder ${{ matrix.builder_args }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.dist_glob }}
          if-no-files-found: error

      - name: Attach installer to GitHub Release (tag runs only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.dist_glob }}
